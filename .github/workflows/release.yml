name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
